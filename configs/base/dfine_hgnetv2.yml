task: detection

model: RTv4
criterion: RTv4Criterion
postprocessor: PostProcessor

use_focal_loss: True
eval_spatial_size: [640, 640] # h w
checkpoint_freq: 4    # save freq

RTv4:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DFINETransformer
  use_domain_branch: False
  use_domain_film: True

# Add, default for step lr scheduler
lrsheduler: flatcosine
lr_gamma: 1
warmup_iter: 500
flat_epoch: 4000000
no_aug_epoch: 0

HGNetv2:
  pretrained: True
  local_model_dir: ./pretrain/hgnetv2/

HybridEncoder:
  in_channels: [512, 1024, 2048]
  feat_strides: [8, 16, 32]

  # intra
  hidden_dim: 256
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'
  use_ms_gated_aifi: False
  pmgi_hidden_dim: 256
  use_dcp_aifi: False

  # cross
  expansion: 1.0
  depth_mult: 1
  act: 'silu'


DFINETransformer:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3

  num_layers: 6
  eval_idx: -1
  num_queries: 300

  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0

  # NEW
  reg_max: 32
  reg_scale: 4

  # Auxiliary decoder layers dimension scaling
  # "eg. If num_layers: 6 eval_idx: -4,
  # then layer 3, 4, 5 are auxiliary decoder layers."
  layer_scale: 1  # 2


  num_points: [3, 6, 3] # [4, 4, 4] [3, 6, 3]
  cross_attn_method: default # default, discrete
  query_select_method: default # default, agnostic
  use_cb_iqs: False
  class_counts: ~
  cb_iqs_alpha: 0.5
  cb_iqs_score_type: mul


PostProcessor:
  num_top_queries: 300


RTv4Criterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_fgl: 0.15, loss_ddf: 1.5}
  losses: ['vfl', 'boxes', 'local']
  alpha: 0.75
  gamma: 2.0
  reg_max: 32
  use_diw_loss: False
  class_counts: ~
  domain_class_counts: ~
  diw_version: "v1"
  diw_alpha: 0.5
  diw_beta: 0.5
  diw_gamma: 0.25
  diw_min: 0.5
  diw_max: 5.0
  diw_alpha_global: ~
  diw_beta_intra_domain: ~
  diw_gamma_image: ~
  diw_weight_min: ~
  diw_weight_max: ~
  diw_normalize_weight: False
  diw_apply_to_main_cls: True
  diw_apply_to_aux_cls: True
  diw_apply_to_encoder_loss: False
  diw_apply_to_matcher_cost: False
  diw_log_weight_stats: True
  diw_log_first_n_batches: 5

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0
